
services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.local  # ✅ Local env
    environment:
      - USE_DOCKER=true
    depends_on:
      - coordinator
      - node
    command: uvicorn src.app:app --host 0.0.0.0 --port 3000
    restart: always

  coordinator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    env_file:
      - .env.local
    environment:
      - USE_DOCKER=true
    command: uvicorn src.backend.coordinator:app --host 0.0.0.0 --port 8100
    restart: always

  node:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9100:9100"
    env_file:
      - .env.local
    environment:
      - NODE_PORT=9100
      - USE_DOCKER=true
    command: uvicorn src.backend.node:app --host 0.0.0.0 --port 9100
    restart: always
