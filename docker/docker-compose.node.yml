# Contributor stack: run this on the machine whose GPUs you want to donate.
#
# It starts the node agent (which does the actual compute) plus a local
# dashboard so you can register the node and manage it in a browser. The
# coordinator is NOT here -- it runs centrally and this points at it.
#
#   COORDINATOR_URL=https://coordinator.example.com docker compose \
#       -f docker/docker-compose.node.yml up -d --build
#
# Then open http://localhost:3000
#
# There is deliberately no MongoDB: the node reaches the coordinator's API and
# never touches its database.

# Compose names a project after the directory holding the compose file, which
# for this one is "docker" -- a name plenty of machines already use. When that
# happens Compose merges the two into a single project and reconciles the
# containers, so starting a node can take over an unrelated stack. Naming it
# explicitly keeps a contributor's node to itself.
name: helloworldai-node

services:
  node:
    build:
      context: ../
      dockerfile: docker/Dockerfile
      target: node
      args:
        # Only what node.py reaches. The full set pulls in selenium,
        # playwright and the rest, which this never touches.
        REQUIREMENTS: requirements-node.txt
    environment:
      - USE_DOCKER=true
      - ENV=production
      - NODE_PORT=9100
      # Where the central coordinator lives. Required.
      - COORDINATOR_URL=${COORDINATOR_URL:?set COORDINATOR_URL to the coordinator address}
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-60}
      - TASK_POLL_INTERVAL=${TASK_POLL_INTERVAL:-10}
    command: uvicorn src.backend.node:app --host 0.0.0.0 --port 9100
    restart: unless-stopped

    volumes:
      # Keeps the session token handed over by the browser. Without this the
      # node forgets it whenever the container is recreated and silently stops
      # heartbeating until somebody reconnects by hand.
      - node-session:/app/data

    # Hand the host's NVIDIA GPUs to the container. Without this the image has
    # the CUDA libraries but no devices, and the node is rejected for having no
    # GPU. Requires the NVIDIA Container Toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  dashboard:
    build:
      context: ../
      dockerfile: docker/Dockerfile
      target: server
      args:
        # The contributor's local dashboard only proxies to the node and the
        # coordinator, so it needs the same slim set.
        REQUIREMENTS: requirements-node.txt
    ports:
      # Local only: this UI drives your own node and should not be exposed.
      #
      # The host port is settable because 3000 is a popular address -- another
      # dev server, another project, or this project's own test stack. Docker
      # refuses to start with "port is already allocated", which reads as a
      # broken install rather than as a clash you can step around:
      #
      #   DASHBOARD_HOST_PORT=3100 docker compose -f docker/docker-compose.node.yml up -d
      #
      # Only the outside half moves. The container still serves 3000, so
      # nothing inside the stack has to know.
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-3000}:3000"
    environment:
      - USE_DOCKER=true
      - ENV=production
      - DASHBOARD_PORT=3000
      - COORDINATOR_URL=${COORDINATOR_URL:?set COORDINATOR_URL to the coordinator address}
      # The dashboard proxies node calls over the internal compose network.
      - NODE_URL=http://node:9100
    command: uvicorn src.app:app --host 0.0.0.0 --port 3000
    depends_on:
      - node
    restart: unless-stopped

volumes:
  node-session:
