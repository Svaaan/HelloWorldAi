
services:
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile 
    ports:
      - "3000:3000"
    env_file:
      - env/.env.test  
    environment:
      - USE_DOCKER=true
      - ENV=test
    depends_on:
      - coordinator
      - node
    command: uvicorn src.app:app --host 0.0.0.0 --port 3000
    restart: always 

  coordinator:
    build:
      context: .
      dockerfile: docker/Dockerfile  
    ports:
      - "8100:8100"
    env_file:
      - env/.env.test 
    environment:
      - USE_DOCKER=true
      - ENV=test
    command: uvicorn src.backend.coordinator:app --host 0.0.0.0 --port 8100
    restart: always  

  node:
    build:
      context: .
      dockerfile: docker/Dockerfile  
    ports:
      - "9100:9100"
    env_file:
      - env/.env.test  
      - NODE_PORT=9100
      - USE_DOCKER=true
      - ENV=test
    command: uvicorn src.backend.node:app --host 0.0.0.0 --port 9100
    restart: always  
