services:
  dashboard:
    build:
      context: ../  # ✅ correct: project root
      dockerfile: docker/Dockerfile  # ✅ correct path from project root
    ports:
      - "3000:3000"
    env_file:
      - ../env/.env.local  # ✅ correct: env folder from /docker/
    environment:
      - USE_DOCKER=true
      - ENV=test
    depends_on:
      - coordinator
      - node
    command: uvicorn src.app:app --host 0.0.0.0 --port 3000
    restart: always

  coordinator:
    build:
      context: ../  # ✅
      dockerfile: docker/Dockerfile  # ✅
    ports:
      - "8100:8100"
    env_file:
      - ../env/.env.local  # ✅
    environment:
      - USE_DOCKER=true
      - ENV=test
    command: uvicorn src.backend.coordinator:app --host 0.0.0.0 --port 8100
    restart: always

  node:
    build:
      context: ../  # ✅
      dockerfile: docker/Dockerfile  # ✅
    ports:
      - "9100:9100"
    env_file:
      - ../env/.env.local  # ✅
    environment:
      - NODE_PORT=9100
      - USE_DOCKER=true
      - ENV=test
    command: uvicorn src.backend.node:app --host 0.0.0.0 --port 9100
    # Pass the host's NVIDIA GPUs into the container. Without this the image has
    # the CUDA libraries but no devices: torch.cuda.is_available() is False and
    # pynvml finds nothing, so the node is rejected for having no GPU.
    # Requires the NVIDIA Container Toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always
