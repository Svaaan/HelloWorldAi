# The central stack: the coordinator, its database, and the public dashboard.
#
# This is what you run on a server, once, for everyone. Contributors do NOT run
# this -- they run docker-compose.node.yml, which points at whatever address
# this is reachable on.
#
#   cp env/.env.example env/.env.production   # then fill it in
#   docker compose -f docker/docker-compose.yml up -d --build
#
# Both services bind to 127.0.0.1 on purpose. Node session tokens and submitter
# keys travel in request headers, so anything serving this to the internet
# directly over plain HTTP would expose them in transit. Put a reverse proxy
# with TLS in front (see the deployment section of the README), or set
# BIND_ADDRESS=0.0.0.0 if you genuinely mean to publish it unencrypted.

services:
  # The only service reachable from outside. Everything below it binds to
  # 127.0.0.1 and is reached over the internal network.
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"          # HTTP/3
    environment:
      # Set to a real hostname for a real certificate. Left unset, Caddy serves
      # localhost with its own local one, which is what you want when trying
      # the production stack on your own machine.
      # Defaulted here rather than in the Caddyfile: Caddy's {$DOMAIN:localhost}
      # falls back only when the variable is *unset*, and an empty value made
      # the site address disappear -- Caddy then read the whole block as global
      # options and refused to start with "unrecognized global option: encode".
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Without this volume every restart asks Let's
      # Encrypt for a new one, and they rate-limit that.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      dashboard:
        condition: service_healthy

  mongo_prod:
    image: mongo:7
    container_name: mongo_prod
    restart: always
    ports:
      # Localhost only, and on a different host port from the development
      # database so both can run at once without colliding.
      #
      # From this machine, MongoDB Compass attaches with:
      #   mongodb://localhost:27019
      #
      # On a real server, do NOT change this to 0.0.0.0 -- there is no
      # authentication on this instance. Reach it over an SSH tunnel instead,
      # which needs nothing published beyond localhost:
      #   ssh -L 27019:localhost:27019 user@server
      # and then point Compass at mongodb://localhost:27019 as usual.
      - "${MONGO_BIND:-127.0.0.1}:27019:27017"
    volumes:
      # Without this, every node registration and job history is lost the next
      # time the container is replaced.
      - mongo-data:/data/db
    # "Up" is not "working". The previous deployment sat Up for twelve months
    # with no database container at all, and `docker ps` looked perfectly happy.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  coordinator:
    # Pulled, not built. CI publishes this on every push to main, so the
    # server downloads a finished image instead of compiling one while it is
    # also meant to be serving. Override SERVER_IMAGE to pin a specific commit:
    #   SERVER_IMAGE=ghcr.io/svaaan/helloworldai-server:sha-abc123 docker compose up -d
    image: ${SERVER_IMAGE:-ghcr.io/svaaan/helloworldai-server:latest}
    # Kept so the stack can still be built from source on a machine with no
    # access to the registry: `docker compose build` uses this and tags the
    # result with the name above.
    build:
      context: ../
      dockerfile: docker/Dockerfile
      target: server
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8100:8100"
    env_file:
      - ../env/.env.production
    environment:
      - USE_DOCKER=true
      - ENV=production
      - MONGO_URI=${MONGO_URI:-mongodb://mongo_prod:27017}
      - MONGO_DB=${MONGO_DB:-NodeDbProd}
    depends_on:
      mongo_prod:
        # Not merely started. The coordinator connects on startup, and racing a
        # database still opening its files fails in a way that reads as a bug in
        # the coordinator.
        condition: service_healthy
    command: uvicorn src.backend.coordinator:app --host 0.0.0.0 --port 8100
    restart: always
    healthcheck:
      # Unauthenticated, cheap, and it reads the database -- so a green light
      # here means the whole chain answers, not just that uvicorn bound a port.
      test: ["CMD", "curl", "-fsS", "http://localhost:8100/get-connected-nodes-count"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  dashboard:
    # Pulled, not built. CI publishes this on every push to main, so the
    # server downloads a finished image instead of compiling one while it is
    # also meant to be serving. Override SERVER_IMAGE to pin a specific commit:
    #   SERVER_IMAGE=ghcr.io/svaaan/helloworldai-server:sha-abc123 docker compose up -d
    image: ${SERVER_IMAGE:-ghcr.io/svaaan/helloworldai-server:latest}
    # Kept so the stack can still be built from source on a machine with no
    # access to the registry: `docker compose build` uses this and tags the
    # result with the name above.
    build:
      context: ../
      dockerfile: docker/Dockerfile
      target: server
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
    env_file:
      - ../env/.env.production
    environment:
      - USE_DOCKER=true
      - ENV=production
      - COORDINATOR_URL=http://coordinator:8100
    depends_on:
      coordinator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: uvicorn src.app:app --host 0.0.0.0 --port 3000
    restart: always

volumes:
  caddy-data:
  caddy-config:
  mongo-data:
