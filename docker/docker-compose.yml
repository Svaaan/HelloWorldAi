services:
  dashboard:
    build:
      context: ../  
      dockerfile: docker/Dockerfile  
    ports:
      - "3000:3000"
    env_file:
      - ../env/.env.production  
    environment:
      - USE_DOCKER=true
    depends_on:
      - coordinator
    command: uvicorn src.app:app --host 0.0.0.0 --port 3000
    restart: always

  coordinator:
    build:
      context: ../  
      dockerfile: docker/Dockerfile 
    ports:
      - "8100:8100"
    env_file:
      - ../env/.env.production  
    environment:
      - USE_DOCKER=true
    command: uvicorn src.backend.coordinator:app --host 0.0.0.0 --port 8100
    restart: always
