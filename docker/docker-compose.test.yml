services:
  dashboard:
    build:
      context: ../
      dockerfile: docker/Dockerfile
      target: server
    ports:
      - "3000:3000"
    env_file:
      - ../env/.env.test
    environment:
      - USE_DOCKER=true
      - ENV=test
      # The source bind mount means the container would otherwise litter
      # the host tree with __pycache__ owned by the container.
      - PYTHONDONTWRITEBYTECODE=1
      - MONGO_URI=mongodb://mongo_test:27017
    depends_on:
      - coordinator
      - node
      - mongo_test
    command: uvicorn src.app:app --host 0.0.0.0 --port 3000
    restart: always
    volumes:
      - ~/.cache/pip:/root/.cache/pip  # ✅ Optional: pip caching
      # Live source for local development: edit on the host and restart the
      # service instead of rebuilding. Only in the test stack -- the
      # production and node images must ship their own copy of the code.
      - ../src:/app/src

  coordinator:
    build:
      context: ../
      dockerfile: docker/Dockerfile
      target: server
    ports:
      - "8100:8100"
    env_file:
      - ../env/.env.test
    environment:
      - USE_DOCKER=true
      - ENV=test
      # The source bind mount means the container would otherwise litter
      # the host tree with __pycache__ owned by the container.
      - PYTHONDONTWRITEBYTECODE=1
      - MONGO_URI=mongodb://mongo_test:27017
      # Submitted datasets are encrypted with this before they reach GridFS.
      # A real deployment supplies its own and keeps it out of source control;
      # this one exists so the test stack exercises the encrypted path.
      - ARTIFACT_ENCRYPTION_KEY=1AKVwQbVtCnXXgp+R/uioUqN8o47VH0vvd8t4EMJsKU=
    depends_on:
      - mongo_test
    command: uvicorn src.backend.coordinator:app --host 0.0.0.0 --port 8100
    restart: always
    volumes:
      - ~/.cache/pip:/root/.cache/pip  # ✅ Optional: pip caching
      # Live source for local development: edit on the host and restart the
      # service instead of rebuilding. Only in the test stack -- the
      # production and node images must ship their own copy of the code.
      - ../src:/app/src

  node:
    build:
      context: ../
      dockerfile: docker/Dockerfile
      target: node
    ports:
      - "9100:9100"
    env_file:
      - ../env/.env.test
    environment:
      - NODE_PORT=9100
      - USE_DOCKER=true
      - ENV=test
      # The source bind mount means the container would otherwise litter
      # the host tree with __pycache__ owned by the container.
      - PYTHONDONTWRITEBYTECODE=1
      - MONGO_URI=mongodb://mongo_test:27017
    depends_on:
      - mongo_test
      - coordinator
    command: uvicorn src.backend.node:app --host 0.0.0.0 --port 9100
    restart: always
    volumes:
      - ~/.cache/pip:/root/.cache/pip  # ✅ Optional: pip caching
      # Live source for local development: edit on the host and restart the
      # service instead of rebuilding. Only in the test stack -- the
      # production and node images must ship their own copy of the code.
      - ../src:/app/src
      # Survives `up --force-recreate`, not just restart.
      - node-session:/app/data

  mongo_test:
    image: mongo:latest
    container_name: mongo_test
    ports:
      - "27018:27017"
    volumes:
      - ./data/db_test:/data/db
    restart: always

volumes:
  node-session:
