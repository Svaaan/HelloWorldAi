services:
  dashboard:
    build:
      context: ../
      dockerfile: docker/Dockerfile
      cache_from:
        - type=local,src=/tmp/.buildx-cache
      cache_to:
        - type=local,dest=/tmp/.buildx-cache
    ports:
      - "3000:3000"
    env_file:
      - ../env/.env.test
    environment:
      - USE_DOCKER=true
      - ENV=test
      - MONGO_URI=mongodb://mongo_test:27017
    depends_on:
      - coordinator
      - node
      - mongo_test
    command: uvicorn src.app:app --host 0.0.0.0 --port 3000
    restart: always
    volumes:
      - ~/.cache/pip:/root/.cache/pip  # ✅ Optional: pip caching

  coordinator:
    build:
      context: ../
      dockerfile: docker/Dockerfile
      cache_from:
        - type=local,src=/tmp/.buildx-cache
      cache_to:
        - type=local,dest=/tmp/.buildx-cache
    ports:
      - "8100:8100"
    env_file:
      - ../env/.env.test
    environment:
      - USE_DOCKER=true
      - ENV=test
      - MONGO_URI=mongodb://mongo_test:27017
    depends_on:
      - mongo_test
    command: uvicorn src.backend.coordinator:app --host 0.0.0.0 --port 8100
    restart: always
    volumes:
      - ~/.cache/pip:/root/.cache/pip  # ✅ Optional: pip caching

  node:
    build:
      context: ../
      dockerfile: docker/Dockerfile
      cache_from:
        - type=local,src=/tmp/.buildx-cache
      cache_to:
        - type=local,dest=/tmp/.buildx-cache
    ports:
      - "9100:9100"
    env_file:
      - ../env/.env.test
    environment:
      - NODE_PORT=9100
      - USE_DOCKER=true
      - ENV=test
      - MONGO_URI=mongodb://mongo_test:27017
    depends_on:
      - mongo_test
      - coordinator
    command: uvicorn src.backend.node:app --host 0.0.0.0 --port 9100
    # Pass the host's NVIDIA GPUs into the container. Without this the image has
    # the CUDA libraries but no devices: torch.cuda.is_available() is False and
    # pynvml finds nothing, so the node is rejected for having no GPU.
    # Requires the NVIDIA Container Toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always
    volumes:
      - ~/.cache/pip:/root/.cache/pip  # ✅ Optional: pip caching

  mongo_test:
    image: mongo:latest
    container_name: mongo_test
    ports:
      - "27018:27017"
    volumes:
      - ./data/db_test:/data/db
    restart: always
