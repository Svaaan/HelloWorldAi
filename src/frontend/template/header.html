<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/header.css">

<header class="header">
    <a class="header-logo" href="/">
        <span class="node-icon" aria-hidden="true"></span>
        <span>HelloWorldAi</span>
    </a>

    <!-- Each side of the network sees only its own pages. header.js hides the
         rest: a builder has no use for the node agent installer, and somebody
         lending a GPU is not looking for a workspace. -->
    <nav class="header-nav" aria-label="Main">
        <a href="/node" data-role="contributor">Your node</a>
        <a href="/setup" data-role="contributor">Setup</a>
        <a href="/distribution" data-role="builder">Send work</a>
        <a href="/workspace" data-role="builder">Your workspace</a>
    </nav>

    <div class="header-details">
        <p class="info">Nodes online: <span id="connectedNodesCount">&mdash;</span></p>

        <!-- Who is signed in, when anybody is. Set by account.js once
             /auth/me answers; the name is the only thing an account holds
             besides digests. -->
        <span class="header-account" id="headerAccount" hidden></span>

        <!-- One way out, for both kinds of identity.
             There used to be two: this button, which forgets the key, and a
             "Sign out of GitHub" link in the workspace, which ended the
             session. Two controls on one page, both called sign out, doing
             different things and neither saying which -- and only one of them
             destructive. It is one button now, and the dialog says exactly
             what it is about to forget. -->
        <button type="button" class="header-signout" id="signOutButton" hidden
                aria-label="Sign out" title="Sign out">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"
                 focusable="false">
              <path fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round"
                    d="M6 14H3.5A1.5 1.5 0 0 1 2 12.5v-9A1.5 1.5 0 0 1 3.5 2H6M10.5 11 14 8l-3.5-3M14 8H6"/>
            </svg>
        </button>
    </div>
</header>

<!-- Signing out is deleting the only copy of an account, so it asks first and
     says what it is about to destroy. -->
<div id="signOutModal" class="modal-backdrop" role="dialog" aria-modal="true"
     aria-labelledby="signOutTitle">
  <div class="modal-container">
    <button class="modal-close" type="button" data-close="signOutModal"
            aria-label="Close">&times;</button>
    <h3 id="signOutTitle">Sign out</h3>
    <p class="modal-lede" id="signOutLede"></p>
    <!-- Filled by header.js with what this will actually end: the GitHub
         session, the key in this browser, or both. -->
    <ul class="signout-list" id="signOutList"></ul>

    <div id="signOutUnsaved" class="signout-warning" hidden>
      <strong>You have not saved this key.</strong>
      <p>
        There is no password reset and no way to reissue it. Sign out without
        saving it and the jobs and models it owns are gone for good.
      </p>
      <a class="btn" id="signOutSaveFirst" href="/workspace">Save it first</a>
    </div>

    <button id="signOutConfirm" type="button" class="btn signout-danger">
      Sign out
    </button>
    <button type="button" class="btn-ghost" data-close="signOutModal">
      Stay signed in
    </button>
  </div>
</div>
