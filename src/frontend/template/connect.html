<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Node Connection</title>
    <link rel="stylesheet" href="/static/css/connect.css">
</head>


<body>
    <header>
        <h1>
            <div class="node-icon"></div>
            Node Connection
        </h1>
    </header>

    <div class="connect-info">
        <p class="info-text">Connect to the node network to access distributed resources.</p>
        <p class="status-message">Ready to connect</p>
        <button id="connectNodeButton">Connect Node</button>
        <div id="processingMessage" style="display: none;">...</div>
        <div id="resultMessage"></div>

    </div>

    <script>
        async function connectNode() {
            const connectButton = document.getElementById("connectNodeButton");
            const processingMessage = document.getElementById("processingMessage");

            connectButton.disabled = true;
            connectButton.style.display = "none";
            processingMessage.style.display = "flex";

            const CONNECT_ENDPOINT = "/connect-node";

            try {
                const res = await fetch(CONNECT_ENDPOINT, {
                    method: "POST"
                });

                const result = await res.json();
                console.log("Node connection result:", result);

                if (!res.ok || result.error) {
                    throw new Error(result.error || `Connection failed with status: ${res.status}`);
                }

                showMessage("✅ Node connection initiated!", "success");

                setTimeout(() => window.location.href = "/node.html", 2000);

            } catch (err) {
                console.error("❌ Error connecting node:", err);

                let errorMessage;
                if (err.message.includes("Failed to fetch")) {
                    errorMessage = "Cannot reach proxy server. Is the backend running?";
                } else if (err.message.includes("timeout")) {
                    errorMessage = "Connection timed out. Check backend availability.";
                } else {
                    errorMessage = err.message || "Unknown error occurred.";
                }

                showMessage(errorMessage, "error");

                connectButton.disabled = false;
                connectButton.style.display = "block";
                processingMessage.style.display = "none";
            }
        }

        function showMessage(message, type) {
            const resultMessageElement = document.getElementById("resultMessage");
            resultMessageElement.innerHTML = message;
            resultMessageElement.className = type === "success" ? "success-message" : "error-message";

            setTimeout(() => {
                resultMessageElement.innerHTML = "";
            }, 3000);
        }

        // ✅ Ensure event binding after DOM is ready
        document.addEventListener("DOMContentLoaded", () => {
            const connectButton = document.getElementById("connectNodeButton");
            if (connectButton) {
                connectButton.addEventListener("click", connectNode);
            } else {
                console.warn("⚠️ connectNodeButton not found in DOM.");
            }
        });
    </script>

</body>

</html>
