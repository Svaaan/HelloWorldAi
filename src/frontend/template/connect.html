<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <title>Node Information</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #111;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh; /* Use full viewport height */
            align-items: center;
            justify-content: flex-start; /* Start from the top of the page */
        }

        /* Header styling */
        header {
            width: 100%;
            background-color: #222;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6); /* Neon effect */
        }

        h1 {
            color: #00FFFF; /* Neon light blue */
            margin: 0;
        }

        /* Node information box styling */
        .connect-info {
            background: #222;
            padding: 5rem;
            margin: 8rem 0;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6); /* Neon effect */
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Status and success message styling */
        .status {
            font-weight: bold;
            background: #222;
        }

        .success {
            color: #32CD32; /* Green for success */
        }

        .status-message {
            font-weight: bold;
            color: #00FFFF; /* Neon light blue */
        }

        /* Styling for the button and text explaining why to connect */
        .info-text {
            font-size: 18px;
            color: #fff;
            margin-bottom: 20px;
        }

        button {
            background-color: #00FFFF; /* Neon light blue */
            color: #111;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
        }

        button:hover {
            background-color: #00BFFF; /* Lighter blue */
        }

        /* Success or error message styles */
        .success-message {
            color: #32CD32; /* Green for success */
            font-size: 18px;
            margin-top: 20px;
        }

        .error-message {
            color: #FF6347; /* Red for error */
            font-size: 18px;
            margin-top: 20px;
        }

    </style>
</head>

<body>

    <!-- Header Section -->
    <header>
        <h1>NODE AI</h1>
    </header>

    <!-- Connect information section -->
    <div class="connect-info">
        <!-- Explanation text -->
        <p class="info-text">
            In order to provide computational power for AI tasks, you need to connect your node. By connecting, you help power the system and contribute to AI processing.
        </p>

        <!-- New question asking if the user is ready -->
        <p class="status-message">Are you ready to connect?</p>

        <!-- Button to trigger node connection -->
        <button id="connectNodeButton">Connect Node</button>

        <!-- Display processing message initially hidden -->
        <div id="processingMessage" class="status" style="display: none;">
            Connecting... Please wait.
        </div>

        <!-- Success or error message area -->
        <div id="resultMessage"></div>
    </div>

    <script>
        // Connect the node dynamically after fetching the node's own information
        async function connectNode() {
            // Hide the button and show the "Connecting..." message
            document.getElementById("connectNodeButton").style.display = "none";
            document.getElementById("processingMessage").style.display = "block";

            // Fetch the actual node data from the node API
            const nodeRes = await fetch("http://127.0.0.1:9100/");  // Node's own data
            const node = await nodeRes.json();

            if (!node || !node.node) {
                showMessage("Failed to retrieve node details.", "error");
                return;
            }

            const nodeData = node.node;

            try {
                const res = await fetch("http://127.0.0.1:8100/connect-node", { // Send to coordinator
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        node_id: nodeData.node_id,
                        ip: nodeData.ip,
                        port: nodeData.port,
                        capabilities: nodeData.capabilities
                    })
                });

                if (!res.ok) {
                    console.log("Failed to connect node:", res.status);
                    showMessage("Failed to connect node. Please try again.", "error");
                    return;
                }

                const result = await res.json();
                console.log("Node connected:", result);
                showMessage("Node connected successfully!", "success");

                // Redirect to the next step after successful connection
                setTimeout(() => window.location.href = "/node.html", 2000); // Wait before redirect

            } catch (err) {
                console.error("Error connecting node:", err);
                showMessage("Failed to connect node.", "error");
            }
        }

        // Function to display success or error messages
        function showMessage(message, type) {
            const resultMessageElement = document.getElementById("resultMessage");
            resultMessageElement.innerHTML = message;
            if (type === "success") {
                resultMessageElement.className = "success-message";
            } else {
                resultMessageElement.className = "error-message";
            }

            // Automatically hide the message after 3 seconds
            setTimeout(() => {
                resultMessageElement.innerHTML = "";
            }, 3000);
        }

        // When the "Connect Node" button is clicked, try to connect the node
        document.getElementById("connectNodeButton").addEventListener("click", connectNode);
    </script>

</body>

</html>
