<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Node Information</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #111;
            color: #fff;
            padding: 2rem;
            text-align: center;
        }
        h1 {
            color: #4b4d4d; 
        }
        .status {
            font-weight: bold;
            color: #00FFFF; 
        }
        .processing {
            font-weight: bold;
            color: #00FFFF; 
        }
        .intro-text {
            font-size: 20px;
            color: #4b4d4d; 
            margin-top: 20px;
            margin-bottom: 30px;
        }
        button {
            color: #4b4d4d;  /* Neon light blue */
            color: #111;
            padding: 20px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 20px;
        }
        button:hover {
            background-color: #00BFFF; /* Lighter blue */
        }
    </style>
</head>
<body>
    <h1>🧠 Node Information</h1>

    <!-- Cool intro text -->
    <div class="intro-text">
        You are connecting your node to contribute computing power for AI training. Your machine will assist in processing and learning, helping to power the future of artificial intelligence.
    </div>

    <!-- Button to trigger node registration -->
    <button id="connectNodeButton">Connect Node</button>

    <!-- Display processing message initially hidden -->
    <div id="processingMessage" class="status" style="display: none;">
        Processing... Please wait.
    </div>

    <script>
        // Register the node dynamically after fetching the node's own information
        async function registerNode() {
            // Hide the button and show the "Processing..." message
            document.getElementById("connectNodeButton").style.display = "none";
            document.getElementById("processingMessage").style.display = "block";

            // Fetch the actual node data from the node API
            const nodeRes = await fetch("http://127.0.0.1:9100/");
            const node = await nodeRes.json();

            if (!node || !node.node) {
                alert("Failed to retrieve node details.");
                return;
            }

            const nodeData = node.node;

            try {
                const res = await fetch("http://127.0.0.1:8100/register-node", { // Send to coordinator
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        node_id: nodeData.node_id,
                        ip: nodeData.ip,
                        port: nodeData.port,
                        capabilities: nodeData.capabilities
                    })
                });

                if (!res.ok) {
                    console.log("Failed to register node:", res.status);
                    alert("Failed to register node. Please try again.");
                    return;
                }

                const result = await res.json();
                console.log("Node registered:", result);
                alert("Node registered successfully!");

                // Hide the processing message and redirect to node.html after successful registration
                document.getElementById("processingMessage").style.display = "none";
                window.location.href = "/node.html";  // This will route to node.html

            } catch (err) {
                console.error("Error registering node:", err);
                alert("Failed to register node.");
            }
        }

        // When the "Connect Node" button is clicked, try to register the node
        document.getElementById("connectNodeButton").addEventListener("click", registerNode);
    </script>

</body>
</html>
