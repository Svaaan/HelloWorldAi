<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Node Connection</title>
    <link rel="stylesheet" href="/static/css/connect.css">
</head>

<body>
    <header>
        <h1>
            <div class="node-icon"></div>
            Node Connections
        </h1>
    </header>

    <div class="connect-info">
        <p class="info-text">Connect to the node network to access distributed AI computing resources.</p>
        <div id="gpuInfo" style="margin-top: 10px; font-weight: bold;"></div>

        <div class="button-group">
            <a href="/setup" class="setup-button">⚙️ Get Started</a>
            <button id="connectNodeButton">🔗 Connect Node</button>
        </div>

        <!-- ✅ GPU Status Info -->
        <div id="gpuStatusMessage" style="margin-top: 8px; font-size: 14px;"></div>

        <div id="processingMessage" style="display: none;">
            <div class="loading-spinner"></div>
            <span>Establishing connection...</span>
        </div>

        <div id="resultMessage"></div>
    </div>

    <script>
        async function detectGPU() {
            let gpuInfo = "Unknown";
            let isGpuDetected = false;

            try {
                const gl = document.createElement('canvas').getContext('webgl');
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');

                if (debugInfo) {
                    const rawGpuInfo = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);

                    // Clean up the GPU name:
                    gpuInfo = rawGpuInfo
                    gpuInfo = rawGpuInfo
                        .replace(/ANGLE/gi, '') // remove "ANGLE"
                        .replace(/Direct3D11/gi, '') // remove "Direct3D11"
                        .replace(/D3D11/gi, '') // remove "D3D11"
                        .replace(/vs_5_0|ps_5_0/gi, '') // remove shader versions
                        .replace(/\(0x[a-fA-F0-9]+\)/g, '') // remove (0x00002484)
                        .replace(/[()]/g, '') // remove any stray parentheses
                        .replace(/\s{2,}/g, ' ') // clean up extra spaces
                        .trim();


                    if (gpuInfo.toLowerCase().includes("nvidia")) {
                        isGpuDetected = true;
                    }
                }
            } catch (e) {
                console.warn("GPU detection failed:", e);
            }

            const gpuInfoElement = document.getElementById("gpuInfo");
            if (isGpuDetected) {
                gpuInfoElement.textContent = `✅ GPU Detected: ${gpuInfo}`;
                gpuInfoElement.style.color = "#00c853"; // green
                document.getElementById("connectNodeButton").disabled = false;
            } else {
                gpuInfoElement.textContent = "❌ No supported GPU detected. Please check your hardware.";
                gpuInfoElement.style.color = "#ff5252"; // red
                document.getElementById("connectNodeButton").disabled = true;
            }
        }


        async function connectNode() {
            const connectButton = document.getElementById("connectNodeButton");
            const processingMessage = document.getElementById("processingMessage");

            connectButton.disabled = true;
            connectButton.style.display = "none";
            processingMessage.style.display = "flex";

            const CONNECT_ENDPOINT = "/connect-node";

            try {
                const response = await fetch(CONNECT_ENDPOINT, { method: "POST" });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `Connection failed with status: ${response.status}`);
                }

                const result = await response.json();

                if (result.error) {
                    throw new Error(result.error);
                }

                if (!result.node_id) {
                    throw new Error("Node ID missing in response.");
                }

                localStorage.setItem("currentNodeId", result.node_id);

                showMessage("✅ Connection successful. Redirecting to node dashboard...", "success");
                setTimeout(() => window.location.href = "/node", 2000);

            } catch (err) {
                console.error("Error connecting node:", err);
                const errorMessage = err.message.includes("Failed to fetch")
                    ? "Cannot reach server. Please check your connection."
                    : err.message || "An error occurred during connection.";

                showMessage(errorMessage, "error");
                connectButton.disabled = false;
                connectButton.style.display = "block";
                processingMessage.style.display = "none";
            }
        }


        function showMessage(message, type) {
            const resultMessageElement = document.getElementById("resultMessage");
            resultMessageElement.innerHTML = message;
            resultMessageElement.className = type === "success" ? "success-message" : "error-message";
        }

        document.addEventListener("DOMContentLoaded", () => {
            detectGPU(); // ✅ Run GPU detection on load
            const connectButton = document.getElementById("connectNodeButton");
            connectButton?.addEventListener("click", connectNode);
        });
    </script>


</body>

</html>
