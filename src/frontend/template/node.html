<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Node Information</title>
    <link rel="stylesheet" href="/static/css/node.css">
</head>

<body>
    <!-- Dynamic Header Include -->
    <div id="header-placeholder"></div>

    <div class="dashboard-container">
        <div class="node-info">
            <h2>Node Details</h2>
            
            <div id="nodeDetails">
                <p>Loading node information...</p>
            </div>
            <div class="action-section">
                <a href="distribution.html" class="action-button">Manage Distribution</a>
            </div>
        </div>

        <div class="usage-info">
            <button class="refresh-button" onclick="manualRefresh()">🔄 Refresh</button>
            <h2>System Usage</h2>
            <div>
                <div class="node-detail">
                    <span>CPU Usage</span>
                    <span id="cpuUsagePercent">0%</span>
                </div>
                <div class="usage-bar">
                    <div id="cpuUsageBar" class="usage-bar-fill" style="width: 0%"></div>
                </div>

                <div class="node-detail">
                    <span>GPU Usage</span>
                    <span id="gpuUsagePercent">0%</span>
                </div>
                <div class="usage-bar">
                    <div id="gpuUsageBar" class="usage-bar-fill" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Load Header and Stats -->
    <script type="module">
        import { loadHeader } from "/static/js/header.js";
        loadHeader();
    </script>

    <script>
        async function fetchNodeInfo() {
            try {
                const res = await fetch("/nodes");
                const data = await res.json();

                if (!data || data.length === 0) {
                    document.getElementById("nodeDetails").innerHTML =
                        "<p class='status-disconnected'>❌ No nodes connected yet.</p>";
                    return;
                }

                const node = data[0];

                const nodeDetailsHTML = `
                    <div class="node-detail"><span class="node-detail-label">Node ID:</span> <span>${node.node_id}</span></div>
                    <div class="node-detail"><span class="node-detail-label">Country:</span> <span>${node.country || 'Unknown'}</span></div>
                    <div class="node-detail"><span class="node-detail-label">CPU:</span>
                        <span>${node.capabilities?.cpu?.brand || 'Unknown'}, ${node.capabilities?.cpu?.cores || 'N/A'} cores</span>
                    </div>
                    <div class="node-detail"><span class="node-detail-label">Compute Score:</span> <span>${(node.compute_score || 0).toFixed(2)}</span></div>
                    <div class="node-detail"><span class="node-detail-label">GPUs:</span></div>
                    ${(Array.isArray(node.capabilities?.gpu) ? node.capabilities.gpu : [node.capabilities.gpu || {}])
                        .map(gpu => `
                            <div class="node-detail">
                                <span class="node-detail-label">→ ${gpu.name || 'Unknown'}</span>
                                <span>
                                    ${gpu.total_memory ?? '?'} MB total,
                                    ${gpu.free_memory ?? '?'} MB free,
                                    ${gpu.used_memory ?? '?'} MB used,
                                    ${gpu.load_percentage ?? '?'}% load,
                                    ${gpu.temperature ?? '?'}°C
                                </span>
                            </div>
                        `).join('')}
                `;

                document.getElementById("nodeDetails").innerHTML = nodeDetailsHTML;
            } catch (err) {
                document.getElementById("nodeDetails").innerHTML =
                    "<p class='status-disconnected'>⚠️ Error loading node details.</p>";
                console.error("Error fetching node details:", err);
            }
        }

        async function fetchUsageInfo() {
            try {
                const res = await fetch("/usage");
                const data = await res.json();

                document.getElementById("cpuUsagePercent").textContent = `${data.cpu_usage || 0}%`;
                document.getElementById("gpuUsagePercent").textContent = `${data.gpu_usage || 0}%`;

                document.getElementById("cpuUsageBar").style.width = `${data.cpu_usage || 0}%`;
                document.getElementById("gpuUsageBar").style.width = `${data.gpu_usage || 0}%`;
            } catch (err) {
                console.error("Error fetching usage details:", err);
            }
        }

        function manualRefresh() {
            fetchNodeInfo();
            fetchUsageInfo();
        }

        let isRefreshing = false;
        function startPeriodicRefresh() {
            setInterval(async () => {
                if (isRefreshing) return;
                isRefreshing = true;

                try {
                    await Promise.all([
                        fetchNodeInfo(),
                        fetchUsageInfo()
                    ]);
                } catch (err) {
                    console.error("Periodic refresh error:", err);
                }

                isRefreshing = false;
            }, 60000);
        }

        window.addEventListener('load', () => {
            manualRefresh(); // Initial
            startPeriodicRefresh();
        });
    </script>
</body>

</html>
