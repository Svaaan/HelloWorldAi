<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Node Information</title>
</head>
<body>
    <!-- Embedded Header -->
    <header class="header">
        <div class="header-logo">
            <img src="/api/placeholder/40/40" alt="Logo" />
            <span>AI Node Network</span>
        </div>
        <div class="header-details">
            <p class="info">Total Power: <span id="totalPower">Loading...</span></p>
            <p class="info">Connected Nodes: <span id="connectedNodesCount">Loading...</span></p>
        </div>
    </header>

    <div class="dashboard-container">
        <div class="node-info">
            <h2>Node Details</h2>
            <div id="nodeDetails">
                <p>Loading node information...</p>
            </div>
            <div class="action-section">
                <a href="distribution.html" class="action-button">Manage Distribution</a>
            </div>
        </div>

        <div class="usage-info">
            <h2>System Usage</h2>
            <div>
                <div class="node-detail">
                    <span>CPU Usage</span>
                    <span id="cpuUsagePercent">0%</span>
                </div>
                <div class="usage-bar">
                    <div id="cpuUsageBar" class="usage-bar-fill" style="width: 0%"></div>
                </div>

                <div class="node-detail">
                    <span>GPU Usage</span>
                    <span id="gpuUsagePercent">0%</span>
                </div>
                <div class="usage-bar">
                    <div id="gpuUsageBar" class="usage-bar-fill" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchTotalPower() {
            try {
                const res = await fetch("/get-total-power");
                const data = await res.json();
                
                const totalPower = data?.total_compute_score 
                    ? `${data.total_compute_score.toFixed(2)} compute units` 
                    : "N/A";
                
                document.getElementById("totalPower").textContent = totalPower;
    
                const nodeDetailsContainer = document.getElementById("powerNodeDetails");
                if (nodeDetailsContainer && data.node_details) {
                    const detailsHTML = data.node_details.map(node => `
                        <div class="power-node-detail">
                            <strong>Node ID:</strong> ${node.node_id || 'Unknown'}<br>
                            <strong>CPU:</strong> ${node.cpu?.brand || 'Unknown'} (${node.cpu?.cores || 'N/A'} cores)<br>
                            <strong>GPU:</strong> ${node.gpu?.name || 'No GPU'}<br>
                            <strong>Compute Score:</strong> ${node.compute_score ? node.compute_score.toFixed(2) : 'N/A'}
                        </div>
                    `).join('');
                    nodeDetailsContainer.innerHTML = detailsHTML;
                }
            } catch (err) {
                document.getElementById("totalPower").textContent = "Error";
                console.error("Total power fetch error:", err);
            }
        }
    
        async function fetchConnectedNodesCount() {
            try {
                const res = await fetch("/get-connected-nodes-count");
                const data = await res.json();
                document.getElementById("connectedNodesCount").textContent = 
                    data?.connected_nodes_count ?? "N/A";
            } catch (err) {
                document.getElementById("connectedNodesCount").textContent = "Error";
                console.error("Connected nodes count fetch error:", err);
            }
        }
    
        async function fetchNodeInfo() {
    try {
        const res = await fetch("/nodes");
        const data = await res.json();

        if (data.length === 0) {
            document.getElementById("nodeDetails").innerHTML = 
                "<p class='status-disconnected'>❌ No nodes connected yet.</p>";
            return;
        }

        const node = data[0];
        
        // Ensure all values have fallbacks
        const nodeDetails = {
            id: node.node_id || 'Unknown',
            ip: node.ip || 'N/A',
            port: node.port || 'N/A',
            cpuBrand: node.capabilities?.cpu?.brand || 'Unknown',
            cpuCores: node.capabilities?.cpu?.cores || 'N/A',
            gpu: node.capabilities?.gpu?.name || 'No GPU detected',
            computeScore: node.compute_score?.toFixed(2) || 'N/A'
        };

        document.getElementById("nodeDetails").innerHTML = `
            <div class="node-detail">
                <span class="node-detail-label">Node ID:</span>
                <span>${nodeDetails.id}</span>
            </div>
            <div class="node-detail">
                <span class="node-detail-label">IP:</span>
                <span>${nodeDetails.ip}</span>
            </div>
            <div class="node-detail">
                <span class="node-detail-label">Port:</span>
                <span>${nodeDetails.port}</span>
            </div>
            <div class="node-detail">
                <span class="node-detail-label">CPU:</span>
                <span>${nodeDetails.cpuBrand}, ${nodeDetails.cpuCores} cores</span>
            </div>
            <div class="node-detail">
                <span class="node-detail-label">GPU:</span>
                <span>${nodeDetails.gpu}</span>
            </div>
            <div class="node-detail">
                <span class="node-detail-label">Compute Score:</span>
                <span>${nodeDetails.computeScore}</span>
            </div>
        `;
    } catch (err) {
        document.getElementById("nodeDetails").innerHTML = 
            "<p class='status-disconnected'>⚠️ Error loading node details.</p>";
        console.error("Error fetching node details:", err);
    }
}
        async function fetchUsageInfo() {
            try {
                const res = await fetch("/usage");
                const data = await res.json();
    
                document.getElementById("cpuUsagePercent").textContent = `${data.cpu_usage || 0}%`;
                document.getElementById("gpuUsagePercent").textContent = `${data.gpu_usage || 0}%`;
                
                document.getElementById("cpuUsageBar").style.width = `${data.cpu_usage || 0}%`;
                document.getElementById("gpuUsageBar").style.width = `${data.gpu_usage || 0}%`;
            } catch (err) {
                document.getElementById("usageDetails").innerHTML = 
                    "<p class='status-disconnected'>⚠️ Error loading usage details.</p>";
                console.error("Error fetching usage details:", err);
            }
        }
    
        // Periodic refresh every 5 seconds
        function startPeriodicRefresh() {
            setInterval(() => {
                fetchTotalPower();
                fetchConnectedNodesCount();
                fetchNodeInfo();
                fetchUsageInfo();
            }, 5000);
        }
    
        // Fetch all information when page loads and start periodic refresh
        window.addEventListener('load', () => {
            fetchTotalPower();
            fetchConnectedNodesCount();
            fetchNodeInfo();
            fetchUsageInfo();
            startPeriodicRefresh();
        });
    </script>
    
</body>
</html>
