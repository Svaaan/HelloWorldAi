<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Node Information</title>
    <link rel="stylesheet" href="/static/css/node.css">
</head>

<body>
    <!-- Dynamic Header Include -->
    <div id="header-placeholder"></div>

    <div class="dashboard-container">
        <div class="node-info">
            <h2>Node Details</h2>
            <div id="nodeDetails">
                <p>Loading node information...</p>
            </div>
            <div class="action-section">
                <a href="/distribution" class="action-button">Manage Distribution</a>
            </div>
        </div>

        <div class="usage-info">
            <button class="refresh-button" onclick="manualRefresh()">Refresh</button>
            <h2>System Usage</h2>
            <div>
                <div class="node-detail">
                    <span>CPU Usage</span>
                    <span id="cpuUsagePercent">0%</span>
                </div>
                <div class="usage-bar">
                    <div id="cpuUsageBar" class="usage-bar-fill"></div>
                </div>

                <div class="node-detail">
                    <span>GPU Usage</span>
                    <span id="gpuUsagePercent">0%</span>
                </div>
                <div class="usage-bar">
                    <div id="gpuUsageBar" class="usage-bar-fill"></div>
                </div>
            </div>

            <div class="node-detail availability-container">
                <div class="switch-container">
                    <label class="switch">
                        <input type="checkbox" id="availabilityToggle">
                        <span class="slider">
                            <div class="switch-icons">
                                <i>O</i>
                                <i>Power</i>
                            </div>
                        </span>
                    </label>
                    <span id="availabilityStatus"></span>
                    <div id="toggleProcessing" class="toggle-processing">
                        <div class="loading-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                    <span id="toggleStatusMessage" class="toggle-status-message"></span>
                </div>
                <div class="task-panel">
                    <h2>Pending Tasks</h2>
                    <div id="taskList"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { loadHeader } from "/static/js/component/header.js";
        import { loadPendingTasks } from "/static/js/nodejs/taskList.js";

        loadHeader();
        loadPendingTasks();
    </script>

    <script>
        let currentNodeId = localStorage.getItem("currentNodeId");

        async function fetchNodeInfo() {
            if (!currentNodeId) {
                document.getElementById("nodeDetails").innerHTML =
                    "<p class='status-disconnected'>Access denied: No node ID in localStorage.</p>";
                document.getElementById("availabilityToggle").disabled = true;
                return;
            }

            try {
                const res = await fetch(`/nodes?node_id=${currentNodeId}`);
                const data = await res.json();

                if (!data || data.length === 0) {
                    document.getElementById("nodeDetails").innerHTML =
                        "<p class='status-disconnected'>Access denied: No nodes connected yet.</p>";
                    document.getElementById("availabilityToggle").disabled = true;
                    return;
                }

                const node = data.find(n => n.node_id === currentNodeId);

                if (!node) {
                    document.getElementById("nodeDetails").innerHTML =
                        "<p class='status-disconnected'>Access denied: Node not found or not owned by you.</p>";
                    document.getElementById("availabilityToggle").disabled = true;
                    localStorage.removeItem("currentNodeId");
                    return;
                }

                const connectionStatus = node.isConnected
                    ? '<span class="status-connected">Connected</span>'
                    : '<span class="status-disconnected">Disconnected</span>';

                const nodeDetailsHTML = `
                <div class="node-detail-group">
                    <div class="node-detail">
                        <span class="node-detail-label">Node ID:</span> <span>${node.node_id}</span>
                    </div>
                    <div class="node-detail">
                        <span class="node-detail-label">Country:</span> <span>${node.country || 'Unknown'}</span>
                    </div>
                    <div class="node-detail">
                        <span class="node-detail-label">Status:</span> ${connectionStatus}
                    </div>
                    <div class="node-detail">
                        <span class="node-detail-label">CPU:</span>
                        <span>${node.capabilities?.cpu?.brand || 'Unknown'}, ${node.capabilities?.cpu?.cores || 'N/A'} cores</span>
                    </div>
                    <div class="node-detail">
                        <span class="node-detail-label">GPUs:</span>
                    </div>
                    ${(Array.isArray(node.capabilities?.gpu) ? node.capabilities.gpu : [node.capabilities.gpu || {}])
                        .map(gpu => `
                        <div class="node-detail">
                            <span class="node-detail-label">→ ${gpu.name || 'Unknown'}</span>
                            <span>
                                ${gpu.total_memory ?? '?'} MB total,
                                ${gpu.free_memory ?? '?'} MB free,
                                ${gpu.used_memory ?? '?'} MB used,
                                ${gpu.load_percentage ?? '?'}% load,
                                ${gpu.temperature ?? '?'}°C
                            </span>
                        </div>
                    `).join('')}
                    <hr />
                </div>
                `;

                document.getElementById("nodeDetails").innerHTML = nodeDetailsHTML;

                updateAvailabilityStatus(node.isAvailable);

                const availabilityToggle = document.getElementById("availabilityToggle");
                if (availabilityToggle) {
                    availabilityToggle.checked = node.isAvailable;
                }

            } catch (err) {
                document.getElementById("nodeDetails").innerHTML =
                    "<p class='status-disconnected'>Error loading node details.</p>";
                console.error("Error fetching node details:", err);
            }
        }

        function updateAvailabilityStatus(isAvailable) {
            const availabilityStatus = document.getElementById("availabilityStatus");
            availabilityStatus.innerHTML = isAvailable
                ? '<span class="status-available">Available</span>'
                : '<span class="status-unavailable">Not Available</span>';
        }

        async function toggleAvailability(isAvailable) {
            if (!currentNodeId) {
                showToggleMessage("No node connected", "error");
                return;
            }

            const toggleProcessing = document.getElementById("toggleProcessing");
            const availabilityToggle = document.getElementById("availabilityToggle");

            toggleProcessing.style.display = "block";
            availabilityToggle.disabled = true;

            try {
                const res = await fetch(`/toggle-availability/${currentNodeId}`, { method: "PATCH" });
                const result = await res.json();

                if (!res.ok || result.error) {
                    throw new Error(result.error || `Failed with status: ${res.status}`);
                }

                updateAvailabilityStatus(isAvailable);
                showToggleMessage(isAvailable ? "Node is now available" : "Node is now unavailable", "success");

            } catch (err) {
                console.error(`Error toggling availability:`, err);
                availabilityToggle.checked = !isAvailable;
                showToggleMessage("Failed to update availability", "error");
            }

            toggleProcessing.style.display = "none";
            availabilityToggle.disabled = false;
        }

        function showToggleMessage(message, type) {
            const messageElement = document.getElementById("toggleStatusMessage");
            messageElement.textContent = message;
            messageElement.className = `toggle-status-message ${type === "success" ? "success-message" : "error-message"}`;
            setTimeout(() => {
                messageElement.textContent = "";
                messageElement.className = "toggle-status-message";
            }, 3000);
        }

        async function fetchUsageInfo() {
            try {
                const res = await fetch("/usage");
                const data = await res.json();
                document.getElementById("cpuUsagePercent").textContent = `${data.cpu_usage || 0}%`;
                document.getElementById("gpuUsagePercent").textContent = `${data.gpu_usage || 0}%`;
                document.getElementById("cpuUsageBar").style.width = `${data.cpu_usage || 0}%`;
                document.getElementById("gpuUsageBar").style.width = `${data.gpu_usage || 0}%`;
            } catch (err) {
                console.error("Error fetching usage details:", err);
            }
        }

        function manualRefresh() {
            fetchNodeInfo();
            fetchUsageInfo();
        }

        let isRefreshing = false;
        function startPeriodicRefresh() {
            setInterval(async () => {
                if (isRefreshing) return;
                isRefreshing = true;
                try {
                    await Promise.all([fetchNodeInfo(), fetchUsageInfo()]);
                } catch (err) {
                    console.error("Periodic refresh error:", err);
                }
                isRefreshing = false;
            }, 60000);
        }

        window.addEventListener("beforeunload", (event) => {
            if (!currentNodeId) return;
            try {
                navigator.sendBeacon(`/set-availability/${currentNodeId}?available=false`);
            } catch (err) {
                console.warn("Error setting availability to false on unload:", err);
            }
        });

        window.addEventListener("load", () => {
            if (!currentNodeId) {
                currentNodeId = localStorage.getItem("currentNodeId");
                if (!currentNodeId) console.warn("No node ID found in localStorage.");
            }

            const availabilityToggle = document.getElementById("availabilityToggle");
            if (availabilityToggle) {
                availabilityToggle.addEventListener("change", (e) => {
                    toggleAvailability(e.target.checked);
                });
            }

            manualRefresh();
            startPeriodicRefresh();
        });
    </script>

</body>

</html>
