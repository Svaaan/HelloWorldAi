<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Node Information</title>
    <link rel="stylesheet" href="/template/node.css">
</head>

<body>
    <!-- Dynamic Header Include -->
    <div id="header-placeholder"></div>

    <div class="dashboard-container">
        <div class="node-info">
            <h2>Node Details</h2>
            <div id="nodeDetails">
                <p>Loading node information...</p>
            </div>
            <div class="action-section">
                <a href="distribution.html" class="action-button">Manage Distribution</a>
            </div>
        </div>

        <div class="usage-info">
            <h2>System Usage</h2>
            <div>
                <div class="node-detail">
                    <span>CPU Usage</span>
                    <span id="cpuUsagePercent">0%</span>
                </div>
                <div class="usage-bar">
                    <div id="cpuUsageBar" class="usage-bar-fill" style="width: 0%"></div>
                </div>

                <div class="node-detail">
                    <span>GPU Usage</span>
                    <span id="gpuUsagePercent">0%</span>
                </div>
                <div class="usage-bar">
                    <div id="gpuUsageBar" class="usage-bar-fill" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load shared header
        fetch('/template/header.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('header-placeholder').innerHTML = html;
            });

        async function fetchNodeInfo() {
            try {
                const res = await fetch("/nodes");
                const data = await res.json();

                if (!data || data.length === 0) {
                    document.getElementById("nodeDetails").innerHTML =
                        "<p class='status-disconnected'>❌ No nodes connected yet.</p>";
                    return;
                }

                const node = data[0];
                const nodeDetails = {
                    id: node.node_id || 'Unknown',
                    ip: node.ip || 'N/A',
                    port: node.port || 'N/A',
                    cpuBrand: node.capabilities?.cpu?.brand || 'Unknown',
                    cpuCores: node.capabilities?.cpu?.cores || 'N/A',
                    gpu: node.capabilities?.gpu?.name || 'No GPU detected',
                    computeScore: typeof node.compute_score === "number" ? node.compute_score.toFixed(2) : 'N/A'
                };

                document.getElementById("nodeDetails").innerHTML = `
                    <div class="node-detail">
                        <span class="node-detail-label">Node ID:</span>
                        <span>${nodeDetails.id}</span>
                    </div>
                    <div class="node-detail">
                        <span class="node-detail-label">IP:</span>
                        <span>${nodeDetails.ip}</span>
                    </div>
                    <div class="node-detail">
                        <span class="node-detail-label">Port:</span>
                        <span>${nodeDetails.port}</span>
                    </div>
                    <div class="node-detail">
                        <span class="node-detail-label">CPU:</span>
                        <span>${nodeDetails.cpuBrand}, ${nodeDetails.cpuCores} cores</span>
                    </div>
                    <div class="node-detail">
                        <span class="node-detail-label">GPU:</span>
                        <span>${nodeDetails.gpu}</span>
                    </div>
                    <div class="node-detail">
                        <span class="node-detail-label">Compute Score:</span>
                        <span>${nodeDetails.computeScore}</span>
                    </div>
                `;
            } catch (err) {
                document.getElementById("nodeDetails").innerHTML =
                    "<p class='status-disconnected'>⚠️ Error loading node details.</p>";
                console.error("Error fetching node details:", err);
            }
        }

        fetch("/template/header.html")
        .then(res => res.text())
        .then(html => {
            document.getElementById("header-placeholder").innerHTML = html;
            initHeaderStats(); // Call manually after load
        });

    function initHeaderStats() {
        async function updateHeaderStats() {
            try {
                const [powerRes, nodesRes] = await Promise.all([
                    fetch("/get-total-power"),
                    fetch("/get-connected-nodes-count")
                ]);
                const powerData = await powerRes.json();
                const nodesData = await nodesRes.json();

                document.getElementById("totalPower").textContent =
                    typeof powerData.total_compute_score === "number"
                        ? `${powerData.total_compute_score.toFixed(2)} compute units`
                        : "N/A";

                document.getElementById("connectedNodesCount").textContent =
                    nodesData.connected_nodes_count ?? "N/A";

            } catch (error) {
                console.error("Error updating header stats:", error);
                document.getElementById("totalPower").textContent = "Error";
                document.getElementById("connectedNodesCount").textContent = "Error";
            }
        }

        // Initial fetch + interval
        updateHeaderStats();
        setInterval(updateHeaderStats, 5000);
    }

        async function fetchUsageInfo() {
            try {
                const res = await fetch("/usage");
                const data = await res.json();

                document.getElementById("cpuUsagePercent").textContent = `${data.cpu_usage || 0}%`;
                document.getElementById("gpuUsagePercent").textContent = `${data.gpu_usage || 0}%`;

                document.getElementById("cpuUsageBar").style.width = `${data.cpu_usage || 0}%`;
                document.getElementById("gpuUsageBar").style.width = `${data.gpu_usage || 0}%`;
            } catch (err) {
                console.error("Error fetching usage details:", err);
            }
        }

        let isRefreshing = false;
        function startPeriodicRefresh() {
            setInterval(async () => {
                if (isRefreshing) return;
                isRefreshing = true;

                try {
                    await Promise.all([
                        fetchNodeInfo(),
                        fetchUsageInfo()
                    ]);
                } catch (err) {
                    console.error("Periodic refresh error:", err);
                }

                isRefreshing = false;
            }, 5000);
        }

        window.addEventListener('load', () => {
            fetchNodeInfo();
            fetchUsageInfo();
            startPeriodicRefresh();
        });
    </script>
</body>
</html>
