<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Node Information</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            color: #fff;
            line-height: 1.6;
        }

        .header {
            background-color: #222;
            color: #00FFFF;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 255, 255, 0.3);
        }

        .header-logo {
            display: flex;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .header-details {
            text-align: right;
        }

        .header-details .info {
            color: #fff;
            margin: 5px 0;
            font-size: 0.9rem;
        }

        .header-details .info span {
            color: #00FFFF;
            font-weight: bold;
        }

        .dashboard-container {
            display: flex;
            max-width: 1200px;
            margin: 2rem auto;
            gap: 2rem;
            padding: 0 1rem;
        }

        .node-info, .usage-info {
            background: #222;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            flex: 1;
        }

        .node-info h2, .usage-info h2 {
            color: #00FFFF;
            border-bottom: 2px solid #00FFFF;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }

        .node-detail {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .node-detail-label {
            color: #00FFFF;
            font-weight: bold;
        }

        .usage-bar {
            background-color: #333;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .usage-bar-fill {
            background-color: #00FFFF;
            height: 100%;
            transition: width 0.5s ease;
        }

        .status-connected {
            color: #32CD32;
        }

        .status-disconnected {
            color: #ff6347;
        }

        .action-button {
            display: inline-block;
            background-color: #00FFFF;
            color: #111;
            padding: 0.75rem 1.5rem;
            border-radius: 5px;
            font-weight: bold;
            text-decoration: none;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            text-align: center;
        }

        .action-button:hover {
            background-color: #fff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        }

        .action-section {
            margin-top: 1.5rem;
            text-align: center;
        }

        @media (max-width: 768px) {
            .dashboard-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Embedded Header -->
    <header class="header">
        <div class="header-logo">
            <img src="/api/placeholder/40/40" alt="Logo" />
            <span>AI Node Network</span>
        </div>
        <div class="header-details">
            <p class="info">Total Power: <span id="totalPower">Loading...</span></p>
            <p class="info">Connected Nodes: <span id="connectedNodesCount">Loading...</span></p>
        </div>
    </header>

    <div class="dashboard-container">
        <div class="node-info">
            <h2>Node Details</h2>
            <div id="nodeDetails">
                <p>Loading node information...</p>
            </div>
            <div class="action-section">
                <a href="distribution.html" class="action-button">Manage Distribution</a>
            </div>
        </div>

        <div class="usage-info">
            <h2>System Usage</h2>
            <div>
                <div class="node-detail">
                    <span>CPU Usage</span>
                    <span id="cpuUsagePercent">0%</span>
                </div>
                <div class="usage-bar">
                    <div id="cpuUsageBar" class="usage-bar-fill" style="width: 0%"></div>
                </div>

                <div class="node-detail">
                    <span>GPU Usage</span>
                    <span id="gpuUsagePercent">0%</span>
                </div>
                <div class="usage-bar">
                    <div id="gpuUsageBar" class="usage-bar-fill" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchTotalPower() {
            try {
                const res = await fetch("http://127.0.0.1:8100/get-total-power");
                const data = await res.json();
                document.getElementById("totalPower").textContent = data?.ai_power ? `${data.ai_power} units` : "N/A";
            } catch (err) {
                document.getElementById("totalPower").textContent = "Error";
                console.error("Total power fetch error:", err);
            }
        }

        async function fetchConnectedNodesCount() {
            try {
                const res = await fetch("http://127.0.0.1:8100/get-connected-nodes-count");
                const data = await res.json();
                document.getElementById("connectedNodesCount").textContent = data?.connected_nodes_count ?? "N/A";
            } catch (err) {
                document.getElementById("connectedNodesCount").textContent = "Error";
                console.error("Connected nodes count fetch error:", err);
            }
        }

        async function fetchNodeInfo() {
            try {
                const res = await fetch("http://127.0.0.1:8100/nodes");
                const data = await res.json();

                if (data.length === 0) {
                    document.getElementById("nodeDetails").innerHTML = "<p class='status-disconnected'>❌ No nodes connected yet.</p>";
                    return;
                }

                const node = data[0];
                const isConnected = (node.isConnected !== undefined) ? 
                    (node.isConnected ? "<span class='status-connected'>✅ Connected</span>" : "<span class='status-disconnected'>❌ Not Connected</span>") :
                    "<span class='status-disconnected'>❌ Connection status unknown</span>";

                document.getElementById("nodeDetails").innerHTML = `
                    <div class="node-detail">
                        <span class="node-detail-label">Node ID:</span>
                        <span>${node.node_id}</span>
                    </div>
                    <div class="node-detail">
                        <span class="node-detail-label">IP:</span>
                        <span>${node.ip}</span>
                    </div>
                    <div class="node-detail">
                        <span class="node-detail-label">Port:</span>
                        <span>${node.port}</span>
                    </div>
                    <div class="node-detail">
                        <span class="node-detail-label">CPU:</span>
                        <span>${node.capabilities.cpu.brand}, ${node.capabilities.cpu.cores} cores</span>
                    </div>
                    <div class="node-detail">
                        <span class="node-detail-label">GPU:</span>
                        <span>${node.capabilities.gpu}</span>
                    </div>
                    <div class="node-detail">
                        <span class="node-detail-label">Connection Status:</span>
                        ${isConnected}
                    </div>
                `;
            } catch (err) {
                document.getElementById("nodeDetails").innerHTML = "<p class='status-disconnected'>⚠️ Error loading node details.</p>";
                console.error("Error fetching node details:", err);
            }
        }

        async function fetchUsageInfo() {
            try {
                const res = await fetch("http://127.0.0.1:9100/usage");
                const data = await res.json();

                document.getElementById("cpuUsagePercent").textContent = `${data.cpu_usage}%`;
                document.getElementById("gpuUsagePercent").textContent = `${data.gpu_usage}%`;
                
                document.getElementById("cpuUsageBar").style.width = `${data.cpu_usage}%`;
                document.getElementById("gpuUsageBar").style.width = `${data.gpu_usage}%`;
            } catch (err) {
                document.getElementById("usageDetails").innerHTML = "<p class='status-disconnected'>⚠️ Error loading usage details.</p>";
                console.error("Error fetching usage details:", err);
            }
        }

        // Fetch all information when page loads
        fetchTotalPower();
        fetchConnectedNodesCount();
        fetchNodeInfo();
        fetchUsageInfo();
    </script>
</body>
</html>
