<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Node Information</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #111;
            color: #fff;
            padding: 2rem;
            text-align: center;
        }
        h1 {
            color: #00FFFF; /* Neon light blue */
        }
        .node-info {
            background: #222;
            padding: 2rem;
            margin: 2rem 0;
            border-radius: 10px;
            text-align: left;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6); /* Neon effect */
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        p {
            font-size: 18px;
        }
        .node-info p {
            margin-bottom: 15px;
        }
        .node-info strong {
            color: #00FFFF; /* Neon light blue */
        }
        .status {
            font-weight: bold;
            color: #ff6347; /* Red for errors */
        }
    </style>
</head>
<body>
    <h1>🧠 Node Information</h1>

    <!-- Display registered node info here -->
    <div class="node-info" id="nodeDetails">
        <p>Loading node details...</p>
    </div>

    <script>
        // Fetch node information dynamically from the Coordinator
        async function fetchNodeInfo() {
            try {
                const res = await fetch("http://127.0.0.1:8100/nodes");
                const data = await res.json();

                if (data.length === 0) {
                    document.getElementById("nodeDetails").innerHTML = "<p class='status'>❌ No nodes registered yet.</p>";
                    return;
                }

                const node = data[0]; // Assuming there's only one node registered

                // Display node information
                document.getElementById("nodeDetails").innerHTML = `
                    <p><strong>Node ID:</strong> ${node.node_id}</p>
                    <p><strong>IP:</strong> ${node.ip}</p>
                    <p><strong>Port:</strong> ${node.port}</p>
                    <p><strong>CPU:</strong> ${node.capabilities.cpu.brand}, ${node.capabilities.cpu.cores} cores, ${node.capabilities.cpu.max_freq} MHz max frequency</p>
                    <p><strong>GPU:</strong> ${node.capabilities.gpu}</p>
                    <p><strong>Registration Status:</strong> ${node.registered ? "✅ Registered" : "❌ Not Registered"}</p>
                `;
            } catch (err) {
                document.getElementById("nodeDetails").innerHTML = "<p class='status'>⚠️ Error loading node details.</p>";
                console.error("Error fetching node details:", err);
            }
        }

        // Fetch node info initially when the page loads
        fetchNodeInfo();
    </script>
</body>
</html>
