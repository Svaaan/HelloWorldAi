<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Node Information</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/node.css">
</head>

<body>
    <!-- Dynamic Header Include -->
    <div id="header-placeholder"></div>

    <div class="dashboard-container">
        <div class="node-info">
            <h2>Node Details</h2>
            <div id="nodeDetails">
                <p>Loading node information...</p>
            </div>
            <div class="action-section">
                <a href="/distribution" class="action-button">Manage Distribution</a>
            </div>
        </div>

        <div class="usage-info">
            <button class="refresh-button" id="refreshNodeInfo" type="button">Refresh</button>
            <h2>System Usage</h2>
            <div>
                <div class="node-detail">
                    <span>CPU Usage</span>
                    <span id="cpuUsagePercent">0%</span>
                </div>
                <div class="usage-bar">
                    <div id="cpuUsageBar" class="usage-bar-fill"></div>
                </div>

                <div class="node-detail">
                    <span>GPU Usage</span>
                    <span id="gpuUsagePercent">0%</span>
                </div>
                <div class="usage-bar">
                    <div id="gpuUsageBar" class="usage-bar-fill"></div>
                </div>
            </div>

            <div class="node-detail availability-container">
                <div class="switch-container">
                    <label class="switch">
                        <input type="checkbox" id="availabilityToggle">
                        <span class="slider">
                            <div class="switch-icons">
                                <i>O</i>
                                <i>Power</i>
                            </div>
                        </span>
                    </label>
                    <span id="availabilityStatus"></span>
                    <div id="toggleProcessing" class="toggle-processing">
                        <div class="loading-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                    <span id="toggleStatusMessage" class="toggle-status-message"></span>
                </div>
                <div class="task-panel">
                    <h2>Jobs</h2>
                    <div id="taskList"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { loadHeader } from "/static/js/component/header.js";
        import { startJobPolling } from "/static/js/nodejs/jobList.js";
        import { initNodeInfoManager } from "/static/js/nodejs/nodeInfo.js";

        // Initialize components independently
        loadHeader();
        startJobPolling();

        // Initialize and expose node info manager
        window.nodeInfoManager = initNodeInfoManager();
    </script>

</body>

</html>
