<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Work</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/distribution.css">
    <link rel="stylesheet" href="/static/css/jobs.css">
    <link rel="stylesheet" href="/static/css/modalHandler.css">
</head>

<body>
    <div id="header-placeholder"></div>

    <main class="distribution-container">
        <div class="page-intro">
            <h1>Send work to a node</h1>
            <p>
                These machines have offered their GPUs to the network. Pick one to
                see what it can do and hand it a training job. Results land in
                <a href="/workspace">your workspace</a>.
            </p>
        </div>

        <section class="distribution-panel">
            <div class="panel-header">
                <h2>Available nodes</h2>
                <div class="panel-actions">
                    <span id="nodeCount" class="panel-count"></span>
                    <button id="refreshNodes" type="button" class="btn-ghost">Refresh</button>
                    <button id="sendAnywhere" type="button" class="btn">Send to any node</button>
                </div>
            </div>

            <div id="nodesList" class="nodes-list">
                <!-- Filled in by fetchAvailableNodes. -->
            </div>
        </section>
    </main>

    <div id="nodeModal" class="modal hidden">
        <div class="modal-content">
            <button id="modalClose" class="close-button" type="button" aria-label="Close">&times;</button>
            <div id="modalNodeDetails"></div>
        </div>
    </div>

    <script type="module" src="/static/js/page/distribution.js"></script>
</body>

</html>
