<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Distribution Center</title>
    <link rel="stylesheet" href="/static/css/distribution.css">
    <link rel="stylesheet" href="/static/css/modalHandler.css">
</head>
<body>
    <!-- Dynamic Header Include -->
    <div id="header-placeholder"></div>

    <div class="distribution-container">
        <a href="node" class="back-link">← Back to Node Overview</a>
        
        <div class="distribution-panel">
            <h2>Available Nodes</h2>
            <div id="nodesList">
                <!-- Dynamic content inserted by fetchAvailableNodes -->
            </div>
        </div>
    </div>

      <div id="nodeModal" class="modal hidden">
        <div class="modal-content">
            <span id="modalClose" class="close-button">&times;</span>
            <div id="modalNodeDetails"></div>
        </div>
    </div>

    <script type="module">
        import { loadHeader } from "/static/js/component/header.js";
        import { fetchAvailableNodes } from "/static/js/distribution/fetchNode.js";
        import { initModalCloseHandler } from "/static/js/distribution/modalHandler.js";
        import { showNodeModal } from "/static/js/distribution/modalHandler.js"; // ✅ Add this import
    
        loadHeader();
        fetchAvailableNodes();
        setInterval(fetchAvailableNodes, 60000);
    
        // Modal close handler
        document.addEventListener("DOMContentLoaded", () => {
            const closeBtn = document.getElementById("modalClose");
            if (closeBtn) {
                closeBtn.addEventListener("click", () => {
                    document.getElementById("nodeModal").classList.add("hidden");
                });
            }
    
            // ✅ Optional safety: initialize modal close handling properly
            initModalCloseHandler();
        });
    </script>
    
</body>
</html>
