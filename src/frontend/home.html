<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>AI Noder – Live</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #111;
            color: #fff;
            padding: 2rem;
        }
        h1 {
            color: #ffd700;
        }
        .node {
            background: #222;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 10px;
        }
        .offline {
            color: red;
        }
        .online {
            color: lightgreen;
        }
    </style>
</head>
<body>
    <h1>🧠 Anslutna AI-noder</h1>
    <div id="nodes"></div>

    <script>
        async function loadNodes() {
            const container = document.getElementById("nodes");
            container.innerHTML = "🔄 Laddar...";

            try {
                const res = await fetch("http://localhost:8100/nodes");
                const nodes = await res.json();

                if (nodes.length === 0) {
                    container.innerHTML = "<p>❌ Inga noder registrerade ännu.</p>";
                    return;
                }

                container.innerHTML = "";
                nodes.forEach(node => {
                    const div = document.createElement("div");
                    div.className = "node";
                    div.innerHTML = `
                        <h2>${node.node_id}</h2>
                        <p>IP: ${node.ip}:${node.port}</p>
                        <p>CPU: ${node.capabilities.cpu}</p>
                        <p>GPU: ${node.capabilities.gpu}</p>
                        <p class="${node.registered ? 'online' : 'offline'}">
                            Status: ${node.registered ? '✅ Registrerad' : '❌ Ej registrerad'}
                        </p>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                container.innerHTML = "<p style='color:red'>⚠️ Kunde inte hämta noder.</p>";
                console.error(err);
            }
        }

        loadNodes();
        setInterval(loadNodes, 5000); // uppdatera var 5:e sekund
    </script>
</body>
</html>
