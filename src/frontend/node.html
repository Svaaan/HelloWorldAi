<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Node Information</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #111;
            color: #fff;
            padding: 2rem;
            text-align: center;
        }
        h1 {
            color: #ffd700;
        }
        .node-info {
            background: #222;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 10px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>🧠 Node Information</h1>

    <div class="node-info" id="nodeDetails">
        <p>Loading node details...</p>
    </div>

    <script>
        async function registerNode() {
            const nodeData = {
                node_id: "node_1", // Replace with actual node ID
                ip: "127.0.0.1",  // Replace with actual IP if needed
                port: "9100",     // Replace with actual port if needed
                capabilities: {
                    cpu: "Intel i7",
                    gpu: "Nvidia RTX 3060"
                }
            };
    
            try {
                const res = await fetch("http://127.0.0.1:3000/register-node", { // Send to dashboard
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(nodeData)
                });
    
                if (!res.ok) {
                    console.log("Failed to register node:", res.status);
                    alert("Failed to register node. Please try again.");
                    return;
                }
    
                const result = await res.json();
                console.log("Node registered:", result);
                alert("Node registered successfully!");
                window.location.href = "node.html"; // Redirect to node.html after successful registration
            } catch (err) {
                console.error("Error registering node:", err);
                alert("Failed to register node.");
            }
        }
    
        document.getElementById("connectNodeButton").addEventListener("click", registerNode);
    </script>
    
</body>
</html>
